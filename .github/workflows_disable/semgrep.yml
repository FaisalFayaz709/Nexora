name: Semgrep
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '33 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
